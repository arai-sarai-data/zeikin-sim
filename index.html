<style>
:root{
  --bg:#f6f5f1; --card:#fff; --ink:#1d1d1f; --sub:#5f6168; --line:#e4e2dc;
  --accent:#c8372d; --accent2:#e07b39; --accent-soft:#fbeae8; --link:#2f6db5; --past:rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){
  :root{--bg:#141416;--card:#1f1f23;--ink:#f1f1f3;--sub:#a4a6ad;--line:#33343a;--accent:#ff6b5e;--accent2:#ff9a5c;--accent-soft:#3a201e;--link:#7fb0ff;--past:rgba(255,255,255,.05)}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans JP","Noto Sans KR","Noto Sans SC","Apple SD Gothic Neo","Malgun Gothic","PingFang SC","Microsoft YaHei",system-ui,sans-serif;line-height:1.6;-webkit-text-size-adjust:100%}
.wrap{max-width:980px;margin:0 auto;padding:12px 14px 60px}
.topbar{display:flex;justify-content:flex-end}
.topbar select{font:inherit;font-size:14px;border:1px solid var(--line);border-radius:999px;padding:6px 12px;background:var(--card);color:var(--ink)}
header h1{font-size:clamp(24px,6vw,38px);font-weight:900;margin:6px 0 4px;letter-spacing:.01em;line-height:1.25}
header h1 em{font-style:normal;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
header p{margin:0;color:var(--sub);font-size:14px}
nav.tabs{display:flex;gap:6px;margin:16px 0 12px;position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0}
nav.tabs a{flex:1;text-align:center;text-decoration:none;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 4px;border-radius:10px;font-weight:700;font-size:14px}
nav.tabs a.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.card h2{font-size:18px;margin:0 0 10px}
.card h3{font-size:15px;margin:18px 0 8px;color:var(--sub);border-top:1px dashed var(--line);padding-top:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
label.f{display:flex;flex-direction:column;font-size:13px;color:var(--sub);gap:4px}
label.f input,label.f select{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%}
.unit{display:flex;align-items:center;gap:6px}.unit span{color:var(--sub);font-size:14px;white-space:nowrap}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--card);color:var(--ink);padding:9px 10px;font:inherit;font-size:14px;cursor:pointer}
.seg button.on{background:var(--accent);color:#fff;font-weight:700}
.chk{display:flex;align-items:center;gap:8px;font-size:14px}
.chk input{width:20px;height:20px;flex:none}
.modebar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.hero{background:linear-gradient(135deg,var(--accent-soft),var(--card));border-color:transparent}
.hero .big{font-size:clamp(36px,11vw,64px);font-weight:900;color:var(--accent);line-height:1.1;margin:4px 0;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.hero .lead{font-size:14px;color:var(--sub)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:12px}
.kpi{background:var(--card);border-radius:12px;padding:10px 12px;border:1px solid var(--line)}
.kpi b{display:block;font-size:19px;font-variant-numeric:tabular-nums;line-height:1.35}
.kpi small{color:var(--sub);font-size:12px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.fact{border-radius:14px;padding:14px;background:var(--bg);border:1px solid var(--line)}
.fact .k{font-size:12px;color:var(--sub);font-weight:700;letter-spacing:.04em}
.fact .v{font-size:clamp(26px,7vw,34px);font-weight:900;color:var(--accent);line-height:1.2;margin:2px 0 4px;font-variant-numeric:tabular-nums}
.fact p{margin:0;font-size:14px}
.fact b{color:var(--accent)}
.meter{height:10px;border-radius:5px;background:var(--line);overflow:hidden;margin-top:8px}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12px;color:var(--sub);font-weight:500}
td.n,th.n{text-align:right;white-space:nowrap}
tr.me td{background:var(--accent-soft);font-weight:700}
#quick{font-size:13px}#quick td,#quick th{padding:7px 3px;white-space:nowrap}
@media(max-width:400px){#quick{font-size:12px}#quick td,#quick th{padding:6px 2px}}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:middle;flex:none}
.bar{height:14px;border-radius:7px;overflow:hidden;display:flex;margin:10px 0 4px;background:var(--line)}
.bar i{display:block;height:100%}
.note{font-size:12px;color:var(--sub)}
.chartbox{position:relative;height:320px}
details summary{cursor:pointer;font-weight:700;padding:6px 0}
.hide{display:none!important}
.pill{display:inline-block;font-size:11px;padding:1px 8px;border-radius:99px;background:var(--accent);color:#fff;margin-top:2px;font-weight:500;white-space:nowrap}
.db td:first-child{font-weight:700;min-width:7em}
a{color:var(--link)}
.scroll{overflow-x:auto}
.sec-title{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
.btn{font:inherit;font-size:14px;font-weight:700;border:0;border-radius:10px;padding:10px 14px;background:var(--ink);color:var(--bg);cursor:pointer;text-decoration:none;display:inline-block}
.btn.x{background:#000;color:#fff}
.use{display:grid;gap:8px;margin-top:8px}
.use .row{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;font-size:14px}
.use .track{grid-column:1/-1;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.use .track i{display:block;height:100%;background:var(--accent)}
.compare{display:grid;grid-template-columns:minmax(0,auto) 1fr auto;gap:6px 10px;align-items:center;font-size:14px;margin-top:8px}
.compare .track{height:12px;border-radius:6px;background:var(--line);overflow:hidden;min-width:60px}
.compare .track i{display:block;height:100%}
.sharecard{border-radius:18px;padding:20px;color:#fff;background:radial-gradient(120% 120% at 0% 0%,#ff6b5e 0%,#c8372d 45%,#5a1410 100%);position:relative;overflow:hidden}
.sharecard .t{font-size:13px;opacity:.85;font-weight:700;letter-spacing:.06em}
.sharecard .who{font-size:14px;opacity:.9;margin-top:2px}
.sharecard .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.sharecard .lbl{font-size:12px;opacity:.8}
.sharecard .num{white-space:nowrap;font-size:clamp(20px,6.2vw,36px);font-weight:900;line-height:1.1;font-variant-numeric:tabular-nums}
.sharecard .foot{margin-top:14px;font-size:13px;border-top:1px solid rgba(255,255,255,.3);padding-top:10px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.sharecard .site{opacity:.75;font-size:11px}
textarea.share{width:100%;min-height:96px;font:inherit;font-size:14px;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--bg);color:var(--ink);margin-top:12px}
@media(max-width:560px){.chartbox{height:260px}.compare{font-size:13px}}
</style>

/* ===================== 制度データ（2026年） ===================== */
const Y0 = 2026;
// 都道府県: [協会けんぽ健康保険料率%, 後期高齢 医療分均等割, 医療分所得割%, 子ども分均等割, 子ども分所得割%]

function curveAt(a){ const c=CURVE; if(a<=c[0][0]) return c[0][1]; if(a>=c[c.length-1][0]) return c[c.length-1][1];

  '2026年（令和8年）の制度で計算しています。過去の年も今の制度で計算した「今の制度ならこれだけ」という目安です。',
  '将来は、すでに決まっている変更だけを反映しています：2027年からの防衛特別所得税1%と復興特別所得税1.1%への引下げ（2047年まで）、厚生年金の標準報酬上限の段階的引上げ（75万円まで）、たばこ税の段階的引上げ、子ども・子育て支援金の段階的増加（総額0.6兆→1.0兆円に比例すると仮定）。',
  '金額は今日の物価での値です（物価上昇分やマクロ経済スライドは含めません）。',
  '所得税の基礎控除は令和8・9年分の額を2028年以降も使っています。実際は2年ごとに物価に合わせて見直されます。',
  '住民税は本来「前年の所得」にかかりますが、同じ年の所得で計算しています。調整控除・非課税の判定は簡易計算です。',
  '健康保険は協会けんぽの都道府県別料率、国民健康保険は横浜市の料率（変更可）、75歳以上は都道府県別の後期高齢者医療の料率、65歳以上の介護保険料は全国平均基準額（月6,225円）×所得段階の概算です。',
  '子どもは16〜18歳で一般扶養、19〜22歳で特定扶養とし、23歳以上は独立したとみなします。',
  '消費税は生活費のうち食費に8%、それ以外の85%に10%がかかると仮定。生活費が空欄なら現役時は手取りの55%、老後は年金手取りの90%（最低月13万円）とします。',
  '公的年金は基礎年金満額＋厚生年金（標準報酬の合計×5.481/1000）の概算です。',

  'Only changes already enacted are reflected: from 2027 the 1% defense surtax with the reconstruction surtax cut to 1.1% (to 2047), the step-up of the pension earnings cap (to ¥750k/month), tobacco tax increases, and the child-support levy growing with its total (¥0.6T → ¥1.0T).',
  'Amounts are in today’s prices (no inflation or pension macro-indexation).',
  'The FY2026–27 basic deduction is used for 2028 onward; in reality it is reviewed every two years.',
  'Resident tax is normally based on the previous year’s income; here the same year is used. Some adjustments are simplified.',
  'Health insurance uses Kyokai Kenpo prefectural rates; National Health Insurance uses Yokohama rates (editable); 75+ uses prefectural rates; long-term care premiums for 65+ use the national average base (¥6,225/month) × income tier.',
  'Children aged 16–18 count as general dependents and 19–22 as specified dependents; 23+ are treated as independent.',
  'Consumption tax assumes 8% on food and 10% on 85% of other spending. If living costs are blank, 55% of take-home pay (90% of pension, min ¥130k/month after retirement) is used.',
  'Pensions = full basic pension + employee pension (total standard pay × 5.481/1000), estimated.',

function fmtMoney(n, lang){
  n=Math.round(n); const neg=n<0; n=Math.abs(n); let s;
  if(lang==='en'){
    if(n>=1e8) s='¥'+(n/1e6).toLocaleString('en-US',{maximumFractionDigits:0})+'M';
    else if(n>=1e6) s='¥'+(n/1e6).toLocaleString('en-US',{maximumFractionDigits:2})+'M';
    else if(n>=1e4) s='¥'+(n/1e3).toLocaleString('en-US',{maximumFractionDigits:0})+'k';
    else s='¥'+n.toLocaleString('en-US');
  } else {
    const U = {ja:['億','万','円',''], zh:['亿','万','日元',''], ko:['억','만','엔',' ']}[lang] || ['億','万','円',''];
    const sp=U[3];
    if(n>=1e8){ const o=Math.floor(n/1e8), m=Math.round((n%1e8)/1e4); s=o+U[0]+(m?sp+m.toLocaleString('ja-JP')+U[1]:'')+sp+U[2]; }
    else if(n>=1e4) s=Math.round(n/1e4).toLocaleString('ja-JP')+U[1]+sp+U[2];
    else s=n.toLocaleString('ja-JP')+sp+U[2];
  }
  return (neg?'-':'')+s;
}
function fmtYen(n, lang){ n=Math.round(n); return lang==='en' ? '¥'+n.toLocaleString('en-US') : n.toLocaleString('ja-JP')+({ja:'円',zh:'日元',ko:' 엔'}[lang]||'円'); }
function fmtDate(dayOfYear, lang){
  const d=new Date(Date.UTC(2026,0,1)); d.setUTCDate(d.getUTCDate()+Math.max(0,Math.min(364,Math.round(dayOfYear))));
  const m=d.getUTCMonth()+1, day=d.getUTCDate();
  if(lang==='en') return d.toLocaleDateString('en-US',{month:'long',day:'numeric',timeZone:'UTC'});
  if(lang==='ko') return `${m}월 ${day}일`;
  return `${m}月${day}日`;
}

function t(k,p){ let s=(T[lang]&&T[lang][k]!=null)?T[lang][k]:T.ja[k]; if(typeof s!=='string') return s; if(p) for(const [a,b] of Object.entries(p)) s=s.split('{'+a+'}').join(b); return s; }
const M = n=>fmtMoney(n,lang), Y = n=>fmtYen(n,lang);
function prefName(k){ if(lang==='ja') return k; const i=PREF_KEYS.indexOf(k); return (PREF_NAMES[lang]||[])[i]||k; }
function applyLang(){
  document.documentElement.lang = lang==='zh'?'zh-CN':lang;
  document.title = t('title');
  $('h1').innerHTML = t('title').replace(/(いくら|how much|多少|얼마나)/i,'<em>$1</em>');
  document.querySelectorAll('[data-t]').forEach(e=>{ e.textContent=t(e.dataset.t); });
  document.querySelectorAll('[data-tp]').forEach(e=>{ e.placeholder=t(e.dataset.tp); });
  const cur=$('pref').value||'全国平均';
  $('pref').innerHTML = PREF_KEYS.map(k=>`<option value="${k}">${prefName(k)}</option>`).join(''); $('pref').value=cur;
  $('aboutList').innerHTML = t('about').map(s=>`<li>${s}</li>`).join('');

}

/* ===================== 入力 ===================== */
function num(id,def=0){ const v=parseFloat($(id).value); return isNaN(v)?def:v; }
function getInput(){
  const d = mode==='detail';
  const kids = d ? ($('kids').value||'').split(/[,、，\s]+/).map(s=>parseInt(s,10)).filter(n=>!isNaN(n)&&n>=0&&n<40).slice(0,10) : [];
  const pref = $('pref').value || '全国平均';
  return sanitize({
    type:$('type').value, age:num('age',35), inc:num('inc',500)*10000, pref,
    spouse: d && $('spouse').checked, kids,
    ideco: d? num('ideco')*10000:0, life: d? +$('life').value:0,
    hrate: d? num('hrate',PREF[pref][0]) : PREF[pref][0], bonus: d? num('bonus'):0,
    showEmployer: d && $('showEmployer').checked,
    aoiro: !d || $('aoiro').checked, jigyo: !d || $('jigyo').checked,
    K: d ? {rate:num('nkRate',KOKUHO_DEF.rate), eq:num('nkEq',KOKUHO_DEF.eq), kRate:num('nkKRate',KOKUHO_DEF.kRate), kEq:num('nkKEq',KOKUHO_DEF.kEq)} : Object.assign({},KOKUHO_DEF),
    spend: d && $('spend').value!=='' ? num('spend')*10000 : null,
    spendR: d && $('spendR').value!=='' ? num('spendR')*10000 : null,
    food: (d? num('food',25):25)/100,
    tabaco: d? num('tabaco'):0, beer: d? num('beer'):0,

function keys(I){ const k=['it','rt','pen','health']; k.push(I.type==='emp'?'koyo':'jigyo'); k.push('cons','other'); if(I.showEmployer) k.push('employer'); return k; }

function tableHTML(parts, tot, label, fmt){
  let h=`<tr><th>${t('colItem')}</th><th class="n">${label}</th><th class="n">${t('colShare')}</th></tr>`;

  const showRank = I.age < I.retire && now.gross>0;
  $('fRankBox').classList.toggle('hide', !showRank);
  if(showRank){ const p=topPercent(now.gross); const ps = p<1?p.toFixed(1):Math.round(p);
    $('fRank').textContent = (lang==='en'?'Top ':lang==='ko'?'상위 ':lang==='zh'?'前':'上位')+ps+'%';
    $('fRankTxt').innerHTML = t('rankTxt',{p:ps}); $('fRankBar').style.width=(100-p)+'%'; }
  const secs = budgetSeconds(yt);
  $('fSec').textContent = (secs<10?secs.toFixed(2):secs.toFixed(1)) + (lang==='en'?' sec':lang==='ko'?'초':'秒');
  $('fSecTxt').innerHTML = t('secTxt',{s:M(BUDGET_TOTAL/(365*24*3600)), x:secs<10?secs.toFixed(2):secs.toFixed(1)});

  $('empNote').textContent = I.type==='emp' && working && !I.showEmployer ? t('empNote',{v:M(now.employer)}) : '';
  const yParts = K.map(k=>({k, v:now[k]}));
  $('yBar').innerHTML = barHTML(yParts);
  $('yTable').innerHTML = tableHTML(yParts, yt, t('colYear'), Y);

  // 比較
  const direct = now.it+now.rt+now.pen+now.health+now.koyo+now.jigyo;
  const myRate = base>0 ? direct/base*100 : 0, myAll = base>0 ? (direct+now.cons+now.other)/base*100 : 0;
  const rowsC = [[t('cmpDirect'), myRate, COLORS.it], [t('cmpAll'), myAll, COLORS.rt], [t('cmpNation'), 45.7, '#7a7f88'], [t('cmpTax'), 28.0, '#a4a6ad'], [t('cmpSoc'), 17.6, '#c4c6cc']];
  $('compare').innerHTML = rowsC.map(([l,v,c])=>`<span>${l}</span><div class="track"><i style="width:${Math.min(100,v/60*100)}%;background:${c}"></i></div><b>${v.toFixed(1)}%</b>`).join('');

  // 使い道
  const kokuzei = now.it + now.cons*0.78;
  $('useLead').innerHTML = t('useLead',{v:M(kokuzei)});
  const bt = BUDGET.reduce((s,b)=>s+b[1],0), bn=t('bud');
  $('use').innerHTML = BUDGET.map(([n,v],i)=>`<div class="row"><span>${bn[i]}</span><b>${M(kokuzei*v/bt)}</b><div class="track"><i style="width:${v/bt*100/0.35}%"></i></div></div>`).join('');

  // 生涯
  let L={}, past=0, fut=0, lifeInc=0, pensionTot=0;
  for(const k of K) L[k]=0;
  for(const r of rows){ const s=total(r,K); for(const k of K) L[k]+=r[k]; if(r.age<I.age) past+=s; else fut+=s; lifeInc += r.gross + r.pensionRecv; pensionTot += r.pensionRecv; }
  const lt = past+fut;
  $('lLeadTop').textContent = t('lifeLead',{a:rows[0].age, b:I.end});
  $('lTotal').textContent = M(lt);
  $('lPast').textContent = M(past); $('lFuture').textContent = M(fut);
  $('lRate').textContent = lifeInc>0 ? (lt/lifeInc*100).toFixed(1)+'%' : '—';
  $('lPension').innerHTML = `${t('pensionYear',{v:M(pension)})}<br><span class="note">${t('pensionTotal',{v:M(pensionTot)})}</span>`;
  $('lYears').innerHTML = t('lifeYearsTxt',{n:(lt/AVG_SALARY).toFixed(1)});
  const lParts = K.map(k=>({k, v:L[k]}));
  $('lBar').innerHTML = barHTML(lParts);
  $('lTable').innerHTML = tableHTML(lParts, lt, t('colLife'), M);
  const S=t('SHORT');
  let yh = `<tr><th>${t('colAge')}</th><th>${t('colYr')}</th><th class="n">${t('colInc')}</th>${K.map(k=>`<th class="n">${S[k]}</th>`).join('')}<th class="n">${t('total')}</th></tr>`;
  for(const r of rows){ yh += `<tr${r.age===I.age?' class="me"':''}><td>${r.age}</td><td>${r.year}</td><td class="n">${M(r.gross+r.pensionRecv)}</td>${K.map(k=>`<td class="n">${(r[k]/1e4).toFixed(1)}</td>`).join('')}<td class="n"><b>${(total(r,K)/1e4).toFixed(1)}</b></td></tr>`; }
  $('yearTable').innerHTML = yh + `<tr><td colspan="${K.length+4}" class="note">${t('manNote')}</td></tr>`;

  // 早見表
  const QM = lang==='en' ? M : (n=>Math.round(n/1e4).toLocaleString('ja-JP'));
  $('quickNote').textContent = t('quickNote',{p:prefName(I.pref)}) + (lang==='en'?'':' '+({ja:'単位：万円',zh:'单位：万日元',ko:'단위: 만 엔'}[lang]));
  let q=`<tr><th>${t('colGross')}</th><th class="n">${t('colTaxes')}</th><th class="n">${t('colNet')}</th><th class="n">${t('colRate')}</th><th class="n">${t('colTop')}</th></tr>`;
  const KQ=['it','rt','pen','health','koyo'];
  const mine = I.type==='emp' && working ? Math.round(now.gross/1e6)*1e6 : -1;
  for(const g of [200,300,400,500,600,700,800,1000,1200,1500,2000,3000]){
    const QI=sanitize(defaultInput({inc:g*1e4, age:35, pref:I.pref, hrate:PREF[I.pref][0]})); const qr=computeYear(QI,35,0);
    const tx=total(qr,KQ); q+=`<tr${g*1e4===mine?' class="me"':''}><td>${QM(g*1e4)}</td><td class="n">${QM(tx)}</td><td class="n">${QM(g*1e4-tx)}</td><td class="n">${(tx/(g*1e4)*100).toFixed(1)}%</td><td class="n">${topPercent(g*1e4).toFixed(1)}%</td></tr>`;
  }
  $('quick').innerHTML=q;

  // シェア
  $('scWho').textContent = `${I.age}${t('ageU')} · ${M(base)} · ${prefName(I.pref)}`;
  $('scYear').textContent = M(yt); $('scLife').textContent = M(lt);
  $('scFoot').textContent = base>0 ? `${t('freedom')}: ${fmtDate(r1*365-1,lang)} / ${(ratio*100).toFixed(0)}%` : '';
  lastShare = t('shareTxt',{inc:M(base), age:I.age, y:M(yt), m:M(yt/12), r:(ratio*100).toFixed(0), d:fmtDate(r1*365-1,lang), end:I.end, l:M(lt)});
  $('shareText').value = lastShare + ' #' + t('hashtag');
  $('xBtn').href = 'https://twitter.com/intent/tweet?text=' + encodeURIComponent(lastShare) + '&hashtags=' + encodeURIComponent(t('hashtag'));

  // グラフ
  const labels = rows.map(r=>`${r.age}`);
  const idx = rows.findIndex(r=>r.age===I.age);
  const ds = K.map(k=>({label:S[k], data:rows.map(r=>+(r[k]/1e4).toFixed(1)), backgroundColor:COLORS[k], borderWidth:0, stack:'s', barPercentage:0.95, categoryPercentage:0.95}));
  $('legend').innerHTML = K.map(k=>`<span><span class="dot" style="background:${COLORS[k]}"></span>${S[k]}</span>`).join('');
  if(!window.Chart){ $('legend').innerHTML += `<span>${t('chartFail')}</span>`; return; }
  const dark = matchMedia('(prefers-color-scheme: dark)').matches; const tc = dark?'#a4a6ad':'#5f6168', gc = dark?'#33343a':'#e9e7e1';
  const unitY = lang==='en' ? (v=>'¥'+(v/100).toFixed(v%100?1:0)+'M') : (v=>v+t('chartUnit'));
  const fmtTip = v => lang==='en' ? M(v*1e4) : v+t('chartUnit');
  if(chart){ chart.data.labels=labels; chart.data.datasets=ds; chart.options.plugins.pastShade.index=idx; chart.update(); }
  else {
    chart = new Chart($('chart'), {type:'bar', data:{labels, datasets:ds}, plugins:[pastShade],
      options:{responsive:true, maintainAspectRatio:false, animation:{duration:200}, interaction:{mode:'index', intersect:false},
        plugins:{pastShade:{index:idx}, legend:{display:false},
          tooltip:{itemSort:(a,b)=>b.parsed.y-a.parsed.y, filter:i=>i.parsed.y>0, callbacks:{
            title:it=>(lang==='en'?'Age ':'')+it[0].label+t('ageSuffix')+(it[0].dataIndex===chart.options.plugins.pastShade.index?t('nowMark'):''),
            footer:it=>t('chartTotal')+' '+fmtTip(+it.reduce((s,i)=>s+i.parsed.y,0).toFixed(1)),
            label:c=>`${c.dataset.label}: ${fmtTip(c.parsed.y)}`}}},
        scales:{x:{stacked:true, ticks:{color:tc, maxRotation:0, autoSkipPadding:10}, grid:{display:false}}, y:{stacked:true, ticks:{color:tc, callback:unitY}, grid:{color:gc}}}}});
  }
}

/* ===================== データベース ===================== */
function renderDB(){
  const q = ($('dbq').value||'').trim().toLowerCase();
  const C=t('dbCols');
  let h=`<tr>${C.map(c=>`<th>${c}</th>`).join('')}</tr>`, n=0;
  for(const e of DB){
    const [name,w,r,c] = e[lang]||e.ja;
    if(q && ![name,w,r,c,...e.ja].join(' ').toLowerCase().includes(q)) continue; n++;
    const src = e.src.map(([o,k])=>`<a href="${SRC[k]}" target="_blank" rel="noopener">${ORG[o][lang]||ORG[o].ja}</a>`).join('<br>')||'—';
    h+=`<tr><td>${name}${e.isNew?`<br><span class="pill">${t('changed')}</span>`:''}</td><td>${w}</td><td>${r}</td><td>${c||'—'}</td><td>${src}</td></tr>`;
  }
  if(!n) h+=`<tr><td colspan="5" class="note">${t('noMatch')}</td></tr>`;
  $('dbTable').innerHTML=h;
  const P=t('prefCols');
  let p=`<tr><th>${P[0]}</th><th class="n">${P[1]}</th><th class="n">${P[2]}</th><th class="n">${P[3]}</th></tr>`;
  for(const k of PREF_KEYS){ const v=PREF[k]; p+=`<tr${k==='全国平均'?' style="font-weight:700"':''}><td>${prefName(k)}</td><td class="n">${v[0].toFixed(2)}%</td><td class="n">${Y(v[1])}</td><td class="n">${v[2].toFixed(2)}%</td></tr>`; }
  p+=`<tr><td colspan="4" class="note">${t('srcLabel')}: <a href="${SRC.kenpoPref}" target="_blank" rel="noopener">${ORG.kenpo[lang]}</a> / <a href="${SRC.kouki}" target="_blank" rel="noopener">${ORG.mhlw[lang]}</a></td></tr>`;
  $('prefTable').innerHTML=p;
}

/* ===================== イベント ===================== */
function showTab(tb){
  if(!['sim','db','about'].includes(tb)) tb='sim';
  document.querySelectorAll('nav.tabs a').forEach(x=>x.classList.toggle('on',x.dataset.tab===tb));
  ['sim','db','about'].forEach(k=>$('tab-'+k).classList.toggle('hide', k!==tb));
}
window.addEventListener('hashchange',()=>{ showTab(location.hash.slice(1)); window.scrollTo({top:0}); });
document.querySelectorAll('nav.tabs a').forEach(a=>a.addEventListener('click',e=>{ e.preventDefault(); const tb=a.dataset.tab; try{ history.replaceState(null,'','#'+tb); }catch(_){} showTab(tb); window.scrollTo({top:0}); }));
document.querySelectorAll('#mode button').forEach(b=>b.addEventListener('click',()=>{
  mode=b.dataset.v; document.querySelectorAll('#mode button').forEach(x=>x.classList.toggle('on',x===b));
  $('detail').classList.toggle('hide', mode!=='detail'); render();
}));
$('lang').innerHTML = Object.entries(LANGS).map(([k,v])=>`<option value="${k}">${v}</option>`).join(''); $('lang').value=lang;
$('lang').addEventListener('change',()=>{ lang=$('lang').value; try{ localStorage.setItem('taxsim-lang',lang); }catch(_){} applyLang(); });
$('pref').innerHTML = PREF_KEYS.map(k=>`<option value="${k}">${k}</option>`).join('');
$('pref').addEventListener('change',()=>{ $('hrate').value = PREF[$('pref').value][0].toFixed(2); });
$('nkRate').value=KOKUHO_DEF.rate.toFixed(2); $('nkEq').value=KOKUHO_DEF.eq; $('nkKRate').value=KOKUHO_DEF.kRate; $('nkKEq').value=KOKUHO_DEF.kEq;
let tm; document.querySelectorAll('#tab-sim input,#tab-sim select').forEach(el=>{ el.addEventListener('input',()=>{clearTimeout(tm);tm=setTimeout(render,120);}); el.addEventListener('change',()=>{clearTimeout(tm);tm=setTimeout(render,50);}); });
$('dbq').addEventListener('input',renderDB);
$('copyBtn').addEventListener('click',async()=>{
  try{ await navigator.clipboard.writeText($('shareText').value); $('copyMsg').textContent=t('copied'); }
  catch(_){ const x=$('shareText'); x.focus(); x.select(); $('copyMsg').textContent=t('selected'); }
});
showTab(location.hash.slice(1)); applyLang();
</script>
